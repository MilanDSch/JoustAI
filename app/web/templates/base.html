<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>{% block title %}AI CTF Duel{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #1a1a2e;
            color: #e0d6c8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1, h2, h3 {
            font-family: 'MedievalSharp', cursive;
            color: #f0c040;
        }

        .container {
            width: 100%;
            max-width: 720px;
            padding: 2rem;
        }

        .card {
            background: #16213e;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .card-header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.3rem;
        }

        .card-header .subtitle {
            color: #8888aa;
            font-size: 0.95rem;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: #f0c040;
            color: #1a1a2e;
        }
        .btn-primary:hover { background: #f5d060; }

        .btn-danger {
            background: #c0392b;
            color: #fff;
        }
        .btn-danger:hover { background: #e74c3c; }

        .btn-secondary {
            background: #2a2a4a;
            color: #e0d6c8;
            border: 1px solid #3a3a5a;
        }
        .btn-secondary:hover { background: #3a3a5a; }

        .btn-block {
            display: block;
            width: 100%;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            color: #c0b8a8;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.7rem 0.9rem;
            background: #0f1a30;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            color: #e0d6c8;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #f0c040;
        }

        .form-group textarea {
            min-height: 140px;
            resize: vertical;
        }

        .form-group .hint {
            font-size: 0.8rem;
            color: #6a6a8a;
            margin-top: 0.3rem;
        }

        .alert {
            padding: 0.9rem 1.2rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
        }

        .alert-error {
            background: rgba(192, 57, 43, 0.2);
            border: 1px solid #c0392b;
            color: #f5a9a0;
        }

        .alert-success {
            background: rgba(39, 174, 96, 0.2);
            border: 1px solid #27ae60;
            color: #a0f5b8;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 1rem;
            color: #f0c040;
        }

        .loading .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #2a2a4a;
            border-top-color: #f0c040;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .chat-history {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 1.5rem;
        }

        .chat-bubble {
            padding: 0.8rem 1rem;
            border-radius: 10px;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .chat-bubble.user {
            background: #2a2a4a;
            margin-left: 2rem;
        }

        .chat-bubble.assistant {
            background: #1e3a5f;
            margin-right: 2rem;
        }

        .chat-bubble .label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }

        .chat-bubble.user .label { color: #f0c040; }
        .chat-bubble.assistant .label { color: #5dade2; }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge-attempts {
            background: rgba(240, 192, 64, 0.2);
            color: #f0c040;
            border: 1px solid #f0c040;
        }

        .result-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .stats {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin: 1.5rem 0;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-family: 'MedievalSharp', cursive;
            font-size: 1.8rem;
            color: #f0c040;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #8888aa;
        }

        .text-center { text-align: center; }
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mt-3 { margin-top: 1.5rem; }
        .mb-2 { margin-bottom: 1rem; }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
