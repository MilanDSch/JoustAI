<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>{% block title %}AI CTF Duel{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Crimson+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/base.css">
    {% block head_extra %}{% endblock %}
</head>
<body>
    <script>
        (function(){var k='visited:'+location.pathname;if(sessionStorage.getItem(k)){document.body.classList.add('no-reveal')}else{sessionStorage.setItem(k,'1')}})();
    </script>
    <img src="/static/delaware-logo-white-rgb.png" alt="Delaware" class="delaware-logo">
    <div class="container {% block container_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
