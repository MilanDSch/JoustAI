{% extends "base.html" %}
{% block title %}AI CTF Duel{% endblock %}

{% block content %}
<div class="card text-center">
    <div class="card-header">
        <h1>JoustAI</h1>
        <p class="subtitle">A battle of wits in the age of AI</p>
    </div>

    <p class="mb-2" style="font-size: 1.05rem;">
        One player defends a secret password with a system prompt.<br>
        The other tries to trick the AI into revealing it.
    </p>

    <form method="post" action="/game/new" class="mt-3">
        <button type="submit" class="btn btn-primary btn-block" style="font-size: 1.15rem; padding: 1rem;">
            Play Game
        </button>
    </form>
</div>
{% endblock %}
